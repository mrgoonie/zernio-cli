name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 20
          - 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate OpenAPI catalog
        run: npm run generate:openapi

      - name: Typecheck
        run: npm run typecheck

      - name: Verify generated commands are in sync
        # Regenerate against the same source the maintainer uses locally
        # (defaults to the public OpenAPI spec at zernio.com). Any diff means
        # someone edited src/commands/generated.ts by hand or forgot to run
        # `npm run gen` after an SDK/spec bump. Run the generator locally,
        # commit the result, and push.
        run: |
          npm run generate:commands
          git diff --exit-code src/commands/generated.ts

      - name: Test with coverage
        run: npm run test:coverage

      - name: Audit
        # Only audit runtime deps. Dev deps (semantic-release, npm bundle) surface
        # transitive CVEs we can't patch without breaking the release pipeline.
        run: npm audit --omit=dev --omit=optional
